<script>

    // ==========================================
    // CONEXIÓN CON TRELLO
    // ==========================================

    const t = window.TrelloPowerUp.iframe();


    // ==========================================
    // ELEMENTOS DE LA INTERFAZ
    // ==========================================

    const btnAgregar =
        document.getElementById('btnAgregar');

    const formularioProducto =
        document.getElementById('formularioProducto');

    const btnCancelar =
        document.getElementById('btnCancelar');

    const btnGuardar =
        document.getElementById('btnGuardar');

    const tablaInventario =
        document.getElementById('tablaInventario');

    const piezasInput =
        document.getElementById('piezas');

    const descripcionInput =
        document.getElementById('descripcion');

    const precioInput =
        document.getElementById('precio');


    // ==========================================
    // MOSTRAR FORMULARIO
    // ==========================================

    btnAgregar.addEventListener('click', function () {

        formularioProducto.style.display = 'block';

        btnAgregar.style.display = 'none';

        piezasInput.focus();

    });


    // ==========================================
    // CANCELAR
    // ==========================================

    btnCancelar.addEventListener('click', function () {

        formularioProducto.style.display = 'none';

        btnAgregar.style.display = 'inline-block';

        limpiarFormulario();

    });


    // ==========================================
    // GUARDAR PRODUCTO
    // ==========================================

    btnGuardar.addEventListener('click', async function () {

        const piezas =
            Number(piezasInput.value);

        const descripcion =
            descripcionInput.value.trim();

        const precio =
            Number(precioInput.value);


        // VALIDAR PIEZAS

        if (
            piezasInput.value === '' ||
            piezas < 0
        ) {

            alert(
                'Ingresa un número válido de piezas.'
            );

            piezasInput.focus();

            return;

        }


        // VALIDAR DESCRIPCIÓN

        if (descripcion === '') {

            alert(
                'Ingresa una descripción.'
            );

            descripcionInput.focus();

            return;

        }


        // VALIDAR PRECIO

        if (
            precioInput.value === '' ||
            precio < 0
        ) {

            alert(
                'Ingresa un precio válido.'
            );

            precioInput.focus();

            return;

        }


        // ======================================
        // CREAR OBJETO DEL PRODUCTO
        // ======================================

        const producto = {

            piezas: piezas,

            descripcion: descripcion,

            precio: precio

        };


        try {

            // ==================================
            // OBTENER INVENTARIO ACTUAL
            // ==================================

            let productos =
                await t.get(
                    'card',
                    'shared',
                    'inventario',
                    []
                );


            if (!Array.isArray(productos)) {

                productos = [];

            }


            // ==================================
            // AGREGAR NUEVO PRODUCTO
            // ==================================

            productos.push(producto);


            // ==================================
            // GUARDAR INVENTARIO EN TRELLO
            // ==================================

            await t.set(
                'card',
                'shared',
                'inventario',
                productos
            );


            // ==================================
            // ACTUALIZAR TABLA
            // ==================================

            mostrarInventario(productos);


            // ==================================
            // LIMPIAR FORMULARIO
            // ==================================

            limpiarFormulario();


            formularioProducto.style.display =
                'none';


            btnAgregar.style.display =
                'inline-block';


            // ==================================
            // NOTIFICACIÓN TEMPORAL
            // ==================================

            await t.notify({
                message: 'Producto agregado al inventario.',
                type: 'success'
            });


        } catch (error) {

            console.error(
                'Error al guardar inventario:',
                error
            );


            alert(
                'No fue posible guardar el producto en Trello.'
            );

        }

    });


    // ==========================================
    // MOSTRAR INVENTARIO
    // ==========================================

    function mostrarInventario(productos) {

        tablaInventario.innerHTML = '';


        if (
            !productos ||
            productos.length === 0
        ) {

            tablaInventario.innerHTML = `

                <tr>

                    <td
                        colspan="4"
                        class="sin-productos">

                        No hay productos
                        en el inventario.

                    </td>

                </tr>

            `;

            return;

        }


        productos.forEach(function (producto) {

            const fila =
                document.createElement('tr');


            fila.innerHTML = `

                <td>
                    ${producto.piezas}
                </td>

                <td>
                    ${producto.descripcion}
                </td>

                <td>
                    $${Number(producto.precio).toFixed(2)}
                </td>

                <td>

                    <button
                        type="button"
                        class="btn-descontar">

                        − Descontar

                    </button>

                </td>

            `;


            tablaInventario.appendChild(fila);

        });

    }


    // ==========================================
    // CARGAR INVENTARIO DESDE TRELLO
    // ==========================================

    async function cargarInventario() {

        try {

            // Esperamos a que Trello termine
            // de inicializar el iframe.

            await t.render();


            // Comprobamos que existe una tarjeta
            // en el contexto actual.

            const contexto =
                await t.getContext();


            console.log(
                'Contexto Trello:',
                contexto
            );


            // Obtener inventario guardado

            const productos =
                await t.get(
                    'card',
                    'shared',
                    'inventario',
                    []
                );


            console.log(
                'Inventario recuperado:',
                productos
            );


            mostrarInventario(productos);


        } catch (error) {

            console.error(
                'Error al cargar inventario:',
                error
            );

        }

    }


    // ==========================================
    // LIMPIAR FORMULARIO
    // ==========================================

    function limpiarFormulario() {

        piezasInput.value = '';

        descripcionInput.value = '';

        precioInput.value = '';

    }


    // ==========================================
    // INICIAR
    // ==========================================

    cargarInventario();

</script>
