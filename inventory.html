<!DOCTYPE html>
<html lang="es">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Inventario</title>
  </head>
  
  <body>
    <div class="inventario-container">
      <h2>Inventario</h2>  
      <table>
        <thread>
          <tr>
            <th>Piezas</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Acción</th>
          </tr>
        </thread>
        <tbody id='tableInvetario'>
          <tr>
            <td colspan="4" class="sin-productos">
              No hay productos en el inventario
            </td>
          </tr>
        </tbody>
      </table>
      <button class="btn-agregar" id="btnAgregar">
        + Agregar producto
      </button>
    </div>
  </body>
</html>
