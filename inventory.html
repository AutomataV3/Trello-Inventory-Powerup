<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <script src="https://trello.com/1/client.js?key=3c3623e5d8a1a7c61958039752f2c9c1"></script>

    <title>Inventario V1.0.3</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f5f7;
            color: #172b4d;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
        }

        .inventario-container {
            background-color: white;
            border-radius: 8px;
            padding: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
        }

        th,
        td {
            padding: 10px;
            border-bottom: 1px solid #dfe1e6;
            text-align: left;
            font-size: 12px;
        }

        th {
            font-weight: bold;
            background-color: #f4f5f7;
        }

        .btn-agregar {
            border: none;
            background-color: #0c66e4;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-agregar:hover {
            background-color: #0055cc;
        }

        .sin-productos {
            text-align: center;
            color: #6b778c;
            padding: 20px;
        }

        /* FORMULARIO */

        .formulario-producto {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background-color: #f4f5f7;
            border-radius: 8px;
        }

        .formulario-producto h3 {
            margin-top: 0;
        }

        .formulario-producto label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .formulario-producto input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px;
            border: 1px solid #dfe1e6;
            border-radius: 5px;
            font-size: 14px;
        }

        .formulario-botones {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-guardar,
        .btn-cancelar {
            border: none;
            padding: 9px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-guardar {
            background-color: #0c66e4;
            color: white;
        }

        .btn-cancelar {
            background-color: #dfe1e6;
            color: #172b4d;
        }

        /* BOTÓN DESCONTAR */

        .btn-descontar {
            border: none;
            background-color: #de350b;
            color: white;
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .btn-descontar:hover {
            background-color: #bf2600;
        }

        .fila-descuento td {
            background-color: #f4f5f7;
            padding: 10px;
        }

        .formulario-descuento {
            padding: 10px;
            border-radius: 6px;
        }

        .formulario-descuento label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 12px;
        }

        .cantidad-descuento {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            border: 1px solid #dfe1e6;
            border-radius: 5px;
            font-size: 13px;
        }

        .botones-descuento {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-confirmar-descuento,
        .btn-cancelar-descuento {
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-confirmar-descuento {
            background-color: #de350b;
            color: white;
        }

        .btn-cancelar-descuento {
            background-color: #dfe1e6;
            color: #172b4d;
        }

    </style>

</head>


<body>

    <div class="inventario-container">

        <h2>Inventario</h2>


        <!-- TABLA DEL INVENTARIO -->

        <table>

            <thead>

                <tr>

                    <th style="width:7%;">
                        Piezas
                    </th>

                    <th style="width:57%;">
                        Descripción
                    </th>

                    <th style="width:16%;">
                        Precio
                    </th>

                    <th style="width:20%;">
                        Acción
                    </th>

                </tr>

            </thead>


            <tbody id="tablaInventario">

                <tr>

                    <td colspan="4"
                        class="sin-productos">

                        No hay productos en el inventario.

                    </td>

                </tr>

            </tbody>

        </table>


        <!-- BOTÓN AGREGAR -->

        <button
            class="btn-agregar"
            id="btnAgregar">

            + Agregar producto

        </button>

        <button
            class="btn-agregar"
            id="btnAutorizar"
            style="margin-left: 8px;">

            Autorizar notificaciones

        </button>

        <button
            type="button"
            class="btn-agregar"
            onclick="probarConexionTrello()">

            Probar conexión Trello

        </button>


        <!-- FORMULARIO -->

        <div
            id="formularioProducto"
            class="formulario-producto">

            <h3>
                Agregar producto
            </h3>


            <label for="piezas">
                Número de piezas
            </label>

            <input
                type="number"
                id="piezas"
                min="0"
                placeholder="Ej. 25">


            <label for="descripcion">
                Descripción
            </label>

            <input
                type="text"
                id="descripcion"
                placeholder="Ej. Sensor inductivo M12">


            <label for="precio">
                Precio
            </label>

            <input
                type="number"
                id="precio"
                min="0"
                step="0.01"
                placeholder="Ej. 125.50">


            <div class="formulario-botones">

                <button
                    type="button"
                    class="btn-guardar"
                    id="btnGuardar">

                    Guardar

                </button>


                <button
                    type="button"
                    class="btn-cancelar"
                    id="btnCancelar">

                    Cancelar

                </button>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

<script>

    // ==========================================
    // CONEXIÓN CON TRELLO
    // ==========================================

    const t = window.TrelloPowerUp.iframe({
        appKey: '3c3623e5d8a1a7c61958039752f2c9c1',
        appName: 'Inventory Manager'
    });

    console.log('CLIENTE TRELLO:', Trello);

    // ==========================================
    // ELEMENTOS DE LA INTERFAZ
    // ==========================================

    const btnAgregar =
        document.getElementById('btnAgregar');

    const btnAutorizar =
        document.getElementById('btnAutorizar');

    const formularioProducto =
        document.getElementById('formularioProducto');

    const btnCancelar =
        document.getElementById('btnCancelar');

    const btnGuardar =
        document.getElementById('btnGuardar');

    const tablaInventario =
        document.getElementById('tablaInventario');

    const piezasInput =
        document.getElementById('piezas');

    const descripcionInput =
        document.getElementById('descripcion');

    const precioInput =
        document.getElementById('precio');


    // ==========================================
    // MOSTRAR FORMULARIO
    // ==========================================

    btnAgregar.addEventListener('click', function () {

        formularioProducto.style.display = 'block';

        btnAgregar.style.display = 'none';

        piezasInput.focus();

    });

    // ==========================================
// AUTORIZAR API DE TRELLO
// ==========================================

    btnAutorizar.addEventListener(
        'click',
        async function () {

            try {

                const api =
                    await t.getRestApi();

                await api.authorize({
                    scope: 'read,write'
                });

                alert(
                    'Inventory Manager ha sido autorizado correctamente.'
                );

            } catch (error) {

                console.error(
                    'Error al autorizar Trello:',
                    error
                );

                alert(
                    'No fue posible autorizar Inventory Manager.'
                );

            }

        }
    );


    // ==========================================
    // CANCELAR
    // ==========================================

    btnCancelar.addEventListener('click', function () {

        formularioProducto.style.display = 'none';

        btnAgregar.style.display = 'inline-block';

        limpiarFormulario();

    });


    // ==========================================
    // GUARDAR PRODUCTO
    // ==========================================

    btnGuardar.addEventListener('click', async function () {

        const piezas =
            Number(piezasInput.value);

        const descripcion =
            descripcionInput.value.trim();

        const precio =
            Number(precioInput.value);


        // VALIDAR PIEZAS

        if (
            piezasInput.value === '' ||
            piezas < 0
        ) {

            alert(
                'Ingresa un número válido de piezas.'
            );

            piezasInput.focus();

            return;

        }


        // VALIDAR DESCRIPCIÓN

        if (descripcion === '') {

            alert(
                'Ingresa una descripción.'
            );

            descripcionInput.focus();

            return;

        }


        // VALIDAR PRECIO

        if (
            precioInput.value === '' ||
            precio < 0
        ) {

            alert(
                'Ingresa un precio válido.'
            );

            precioInput.focus();

            return;

        }


        // ======================================
        // CREAR OBJETO DEL PRODUCTO
        // ======================================

        const producto = {

            piezas: piezas,

            descripcion: descripcion,

            precio: precio

        };


        try {

            // ==================================
            // OBTENER INVENTARIO ACTUAL
            // ==================================

            let productos =
                await t.get(
                    'card',
                    'shared',
                    'inventario',
                    []
                );


            if (!Array.isArray(productos)) {

                productos = [];

            }


            // ==================================
            // AGREGAR NUEVO PRODUCTO
            // ==================================

            productos.push(producto);


            // ==================================
            // GUARDAR INVENTARIO EN TRELLO
            // ==================================

            await t.set(
                'card',
                'shared',
                'inventario',
                productos
            );

            // ==================================
            // ACTUALIZAR TABLA
            // ==================================

            mostrarInventario(productos);


            // ==================================
            // LIMPIAR FORMULARIO
            // ==================================

            limpiarFormulario();


            formularioProducto.style.display =
                'none';


            btnAgregar.style.display =
                'inline-block';

        } catch (error) {

            console.error(
                'Error al guardar inventario:',
                error
            );


            alert(
                'No fue posible guardar el producto en Trello.'
            );

        }

    });


async function agregarComentarioStockAgotado(
    cardId,
    producto,
    cantidadDescontada
) {

    console.log('=================================');
    console.log('CREANDO COMENTARIO DE STOCK AGOTADO');
    console.log('=================================');

    const comentario =
        `🔴 Stock agotado\n\n` +
        `Producto: ${producto.descripcion}\n` +
        `Descuento realizado: ${cantidadDescontada} piezas\n` +
        `Stock restante: ${producto.piezas} piezas`;

    console.log('Card ID:', cardId);
    console.log('Comentario:', comentario);

    try {

        // ==========================================
        // OBTENER CLIENTE REST DE TRELLO
        // ==========================================

        const api =
            await t.getRestApi();

        console.log(
            'Cliente REST obtenido correctamente.'
        );


        // ==========================================
        // VERIFICAR AUTORIZACIÓN
        // ==========================================

        const autorizado =
            await api.isAuthorized();

        console.log(
            '¿Power-Up autorizado?:',
            autorizado
        );

        if (!autorizado) {

            throw new Error(
                'El Power-Up no está autorizado para utilizar la API de Trello.'
            );

        }


        // ==========================================
        // OBTENER TOKEN
        // ==========================================

        const token =
            await api.getToken();

        console.log(
            'Token obtenido correctamente:',
            !!token
        );

        if (!token) {

            throw new Error(
                'No se pudo obtener el token de Trello.'
            );

        }


        // ==========================================
        // API KEY DEL POWER-UP
        // ==========================================

        const apiKey =
            '3c3623e5d8a1a7c61958039752f2c9c1';


        // ==========================================
        // CONSTRUIR URL
        // ==========================================

        const url =
            'https://api.trello.com/1/cards/' +
            encodeURIComponent(cardId) +
            '/actions/comments' +
            '?text=' +
            encodeURIComponent(comentario) +
            '&key=' +
            encodeURIComponent(apiKey) +
            '&token=' +
            encodeURIComponent(token);


        console.log(
            'Enviando POST a Trello...'
        );

        console.log(
            'Endpoint:',
            '/1/cards/{id}/actions/comments'
        );


        // ==========================================
        // CREAR COMENTARIO
        // ==========================================

        const response =
            await fetch(
                url,
                {
                    method: 'POST',

                    headers: {
                        'Accept':
                            'application/json'
                    }
                }
            );


        // ==========================================
        // MOSTRAR RESPUESTA HTTP
        // ==========================================

        console.log(
            'HTTP:',
            response.status,
            response.statusText
        );


        // ==========================================
        // COMPROBAR ERROR HTTP
        // ==========================================

        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                `Trello respondió HTTP ${response.status}: ${errorText}`
            );

        }


        // ==========================================
        // LEER RESPUESTA
        // ==========================================

        const resultado =
            await response.json();


        console.log(
            '================================='
        );

        console.log(
            'COMENTARIO CREADO CORRECTAMENTE'
        );

        console.log(
            'ID DEL COMENTARIO:',
            resultado.id
        );

        console.log(
            'RESPUESTA DE TRELLO:',
            resultado
        );

        console.log(
            '================================='
        );


        return resultado;

    } catch (error) {

        console.error(
            '================================='
        );

        console.error(
            'ERROR AL CREAR COMENTARIO'
        );

        console.error(
            error
        );

        console.error(
            '================================='
        );

        throw error;
    }
}



function probarConexionTrello() {
    const mensaje = `Este no es un comentario`;
    return t.card('id').then(card => {
        const cardId = card.id;
        return t.get('member', 'private', 'authToken').then(token => {
            const key = `3c3623e5d8a1a7c61958039752f2c9c1`;
            const url = `https://api.trello.com/1/cards/${cardId}/actions/comments?key=${key}&token=${token}&text=${encodeURIComponent(mensaje)}`;
            return fetch (url, {
                method: 'POST',
            }).then(response => response.json())
                .then(data => {
                console.log('Comentaio agregado:', data);
            })
                .catch(err => console.error('Error al agregar comentario:', err));
        });
    });
}
    
    // ==========================================
    // MOSTRAR INVENTARIO
    // ==========================================

  function mostrarInventario(productos) {

    tablaInventario.innerHTML = '';


    // ==========================================
    // SIN PRODUCTOS
    // ==========================================

    if (
        !productos ||
        productos.length === 0
    ) {

        tablaInventario.innerHTML = `

            <tr>

                <td
                    colspan="4"
                    class="sin-productos">

                    No hay productos
                    en el inventario.

                </td>

            </tr>

        `;

        return;

    }


    // ==========================================
    // CREAR FILAS
    // ==========================================

    productos.forEach(function (producto, indice) {

        const fila =
            document.createElement('tr');


        fila.innerHTML = `

            <td>
                ${producto.piezas}
            </td>

            <td>
                ${producto.descripcion}
            </td>

            <td>
                $${Number(producto.precio).toFixed(2)}
            </td>

            <td>

                <button
                    type="button"
                    class="btn-descontar">

                    − Descontar

                </button>

            </td>

        `;


        // ======================================
        // BOTÓN DESCONTAR
        // ======================================

        const btnDescontar =
            fila.querySelector('.btn-descontar');


        btnDescontar.addEventListener(
            'click',
            function () {

                // Evitar crear varios formularios
                // para el mismo producto.

                const formularioExistente =
                    fila.nextElementSibling;


                if (
                    formularioExistente &&
                    formularioExistente.classList.contains(
                        'fila-descuento'
                    )
                ) {

                    formularioExistente.remove();

                    return;

                }


                // ==================================
                // CREAR FILA DEL FORMULARIO
                // ==================================

                const filaDescuento =
                    document.createElement('tr');


                filaDescuento.className =
                    'fila-descuento';


                filaDescuento.innerHTML = `

                    <td colspan="4">

                        <div class="formulario-descuento">

                            <label>
                                Piezas a descontar
                            </label>

                            <input
                                type="number"
                                class="cantidad-descuento"
                                min="1"
                                max="${producto.piezas}"
                                placeholder="Ej. 5">

                            <div class="botones-descuento">

                                <button
                                    type="button"
                                    class="btn-confirmar-descuento">

                                    Descontar

                                </button>

                                <button
                                    type="button"
                                    class="btn-cancelar-descuento">

                                    Cancelar

                                </button>

                            </div>

                        </div>

                    </td>

                `;


                // Insertar inmediatamente
                // debajo del producto.

                fila.after(filaDescuento);


                const cantidadInput =
                    filaDescuento.querySelector(
                        '.cantidad-descuento'
                    );


                const btnConfirmar =
                    filaDescuento.querySelector(
                        '.btn-confirmar-descuento'
                    );


                const btnCancelarDescuento =
                    filaDescuento.querySelector(
                        '.btn-cancelar-descuento'
                    );


                cantidadInput.focus();


                // ==================================
                // CANCELAR
                // ==================================

                btnCancelarDescuento.addEventListener(
                    'click',
                    function () {

                        filaDescuento.remove();

                    }
                );


                // ==================================
                // CONFIRMAR DESCUENTO
                // ==================================

                btnConfirmar.addEventListener(
                    'click',
                    async function () {

                        const cantidadTexto =
                            cantidadInput.value;


                        const cantidad =
                            Number(cantidadTexto);


                        // ------------------------------
                        // VALIDAR CANTIDAD
                        // ------------------------------

                        if (
                            cantidadTexto.trim() === '' ||
                            !Number.isInteger(cantidad) ||
                            cantidad <= 0
                        ) {

                            alert(
                                'Ingresa una cantidad válida de piezas.'
                            );

                            cantidadInput.focus();

                            return;

                        }


                        // ------------------------------
                        // VALIDAR STOCK
                        // ------------------------------

                        if (
                            cantidad > producto.piezas
                        ) {

                            alert(
                                `No puedes descontar ${cantidad} piezas.\n\n` +
                                `Stock disponible: ${producto.piezas} piezas.`
                            );

                            cantidadInput.focus();

                            return;

                        }


                        try {

                            // --------------------------
                            // OBTENER INVENTARIO ACTUAL
                            // --------------------------

                            let inventarioActual =
                                await t.get(
                                    'card',
                                    'shared',
                                    'inventario',
                                    []
                                );


                            if (
                                !Array.isArray(
                                    inventarioActual
                                )
                            ) {

                                inventarioActual = [];

                            }


                            // --------------------------
                            // DESCONTAR
                            // --------------------------

                            inventarioActual[indice].piezas -= cantidad;

                            // --------------------------
                            // ELIMINAR SI LLEGA A 0
                            // --------------------------

                            // if (
                            //    inventarioActual[indice].piezas <= 0
                            //) {

                            //    inventarioActual.splice(
                            //        indice,
                            //        1
                            //    );

                            // }


                            // --------------------------
                            // GUARDAR EN TRELLO
                            // --------------------------

                            await t.set(
                                'card',
                                'shared',
                                'inventario',
                                inventarioActual
                            );

                            if (inventarioActual[indice].piezas === 0) {

                                const contexto = await t.getContext();
                                const cardId = contexto.card;

                                await agregarComentarioStockAgotado(cardId, inventarioActual[indice], cantidad);
                            }


                            // --------------------------
                            // ACTUALIZAR TABLA
                            // --------------------------

                            mostrarInventario(
                                inventarioActual
                            );


                        } catch (error) {

                            console.error(
                                'Error al descontar inventario:',
                                error
                            );


                            alert(
                                'No fue posible descontar las piezas del inventario.'
                            );

                        }

                    }
                );

            }
        );


        tablaInventario.appendChild(fila);

    });

}


    // ==========================================
    // CARGAR INVENTARIO DESDE TRELLO
    // ==========================================

    async function cargarInventario() {

        try {

            // Esperamos a que Trello termine
            // de inicializar el iframe.

            t.render(function () {
                console.log('Trello terminó de renderizar el iframe.');
            });


            // Comprobamos que existe una tarjeta
            // en el contexto actual.

            const contexto =
                await t.getContext();


            console.log(
                'Contexto Trello:',
                contexto
            );


            // Obtener inventario guardado

            const productos =
                await t.get(
                    'card',
                    'shared',
                    'inventario',
                    []
                );


            console.log(
                'Inventario recuperado:',
                productos
            );


            mostrarInventario(productos);


        } catch (error) {

            console.error(
                'Error al cargar inventario:',
                error
            );

        }

    }


    // ==========================================
    // LIMPIAR FORMULARIO
    // ==========================================

    function limpiarFormulario() {

        piezasInput.value = '';

        descripcionInput.value = '';

        precioInput.value = '';

    }


    // ==========================================
    // INICIAR
    // ==========================================

    cargarInventario();

</script>


</body>

</html>
